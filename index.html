<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Driver</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #2b2b2b, #000000 70%);
    color:white;
    text-align:center;
    padding:20px;
    overflow-x:hidden;
}

.intro{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:hideIntro 5s forwards;
}

.lambo-gif{
    width:90%;
    max-width:700px;
    filter:drop-shadow(0 0 25px #d4af37);
}

@keyframes hideIntro{
    0%,85%{
        opacity:1;
        visibility:visible;
    }
    100%{
        opacity:0;
        visibility:hidden;
    }
}

.card{
    background: linear-gradient(145deg, #111, #1c1c1c, #080808);
    max-width:500px;
    margin:auto;
    padding:28px;
    border-radius:24px;
    border:2px solid #d4af37;
    box-shadow:0 0 25px rgba(212,175,55,0.45);
}

img{
    width:220px;
    border-radius:18px;
    border:3px solid #d4af37;
    box-shadow:0 0 18px rgba(212,175,55,0.55);
}

h1{
    color:#d4af37;
    text-shadow:0 0 10px rgba(212,175,55,0.5);
}

p{
    color:#e8e8e8;
    font-size:17px;
}

.menu-btn, .button{
    display:block;
    margin:16px auto;
    padding:15px 22px;
    background: linear-gradient(135deg, #8b6508, #d4af37, #f5d76e, #b8860b);
    color:#050505;
    text-decoration:none;
    border-radius:14px;
    font-weight:bold;
    max-width:270px;
    border:1px solid #f5d76e;
    box-shadow:0 0 18px rgba(212,175,55,0.65);
}

.menu-btn{
    font-size:20px;
    cursor:pointer;
}

#menu{
    display:none;
}
</style>
</head>

<body>

<div class="intro">
    <img src="lambo.gif" class="lambo-gif" alt="Lamborghini Animation">
</div>

<div class="card">

    <img src="IMG_1234.jpeg" alt="Driver Photo">

    <h1>Yassin Saber Abdelkader</h1>

    <p>Welcome. I will be your driver for today.</p>

    <button class="menu-btn" onclick="toggleMenu()">✨ View Menu ✨</button>

    <div id="menu">
        <a class="button" href="driver-id.pdf" target="_blank">🪪 View My ID</a>
        <a class="button" href="https://cal.com/ahmed-ramy-vqbfyr/driver-reservation" target="_blank">📅 Book Reservation</a>
        <a class="button" href="https://carshow360.net/en/hyundai/elantra/vii-vii-10017" target="_blank">🚗 View My Car 360°</a>
    </div>

</div>

<script>
function toggleMenu() {
    var menu = document.getElementById("menu");
    if (menu.style.display === "none" || menu.style.display === "") {
        menu.style.display = "block";
    } else {
        menu.style.display = "none";
    }
}
</script>

</body>
</html>
